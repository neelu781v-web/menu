
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Interactive Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: transparent;
            transition: all 0.4s ease;

            z-index: 1000;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Menu */
        .menu {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .menu a {
            position: relative;

            color: white;
            text-decoration: none;
            font-size: 17px;

            padding: 10px 15px;

            transition: color 0.3s ease;
        }

        /* Animated line under menu item */
        .menu a::after {
            content: "";

            position: absolute;
            left: 50%;
            bottom: 0;

            width: 0;
            height: 3px;

            background: #00e5ff;

            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        /* Hover */
        .menu a:hover {
            color: #00e5ff;
        }

        .menu a:hover::after {
            width: 80%;
        }

        /* Navbar after scrolling */
        .navbar.scrolled {
            background: #ffffff;
            padding: 12px 50px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar.scrolled .logo,
        .navbar.scrolled .menu a {
            color: #222;
        }

        .navbar.scrolled .menu a:hover {
            color: #0077ff;
        }

        .navbar.scrolled .menu a::after {
            background: #0077ff;
        }

        /* Hero */
        .hero {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            color: white;

            background: linear-gradient(
                135deg,
                #4b0082,
                #0077ff,
                #00c6ff
            );
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
        }

        /* Sections */
        section:not(.hero) {
            min-height: 100vh;
            padding: 120px 30px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        #about {
            background: #fff3e6;
        }

        #services {
            background: #e6f7ff;
        }

        #contact {
            background: #f0e6ff;
        }

        section h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        section p {
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 600px) {

            .navbar {
                padding: 15px;
            }

            .navbar.scrolled {
                padding: 12px 15px;
            }

            .menu {
                gap: 2px;
            }

            .menu a {
                padding: 8px;
                font-size: 13px;
            }

            .logo {
                font-size: 18px;
            }

            .hero h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">

        <a href="#home" class="logo">
            MyWebsite
        </a>

        <ul class="menu">
            <li>
                <a href="#home">Home</a>
            </li>

            <li>
                <a href="#about">About</a>
            </li>

            <li>
                <a href="#services">Services</a>
            </li>

            <li>
                <a href="#contact">Contact</a>
            </li>
        </ul>

    </nav>

    <!-- Home -->
    <section class="hero" id="home">

        <div>
            <h1>Welcome</h1>
            <p>
                Scroll down and interact with the navigation menu.
            </p>
        </div>

    </section>

    <!-- About -->
    <section id="about">

        <div>
            <h2>About Us</h2>
            <p>
                This is the about section of the website.
            </p>
        </div>

    </section>

    <!-- Services -->
    <section id="services">

        <div>
            <h2>Our Services</h2>
            <p>
                We provide amazing services for our customers.
            </p>
        </div>

    </section>

    <!-- Contact -->
    <section id="contact">

        <div>
            <h2>Contact Us</h2>
            <p>
                You can contact us anytime.
            </p>
        </div>

    </section>

    <script>

        const navbar = document.getElementById("navbar");

        window.addEventListener("scroll", () => {

            if (window.scrollY > 80) {

                navbar.classList.add("scrolled");

            } else {

                navbar.classList.remove("scrolled");

            }

        });

    </script>

</body>
</html>
